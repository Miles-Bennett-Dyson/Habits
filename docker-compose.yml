services:
  web:
    build: .
    image: drf
    container_name: drf_project
    command: bash -c "python manage.py migrate"

    env_file:
      - ./.env

    volumes:
      - .:/app
      - /app/.venv
      - static_volume:/app/staticfiles

    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  celery_worker:
    build: .
    command: celery -A config worker --loglevel=info
    image: celery_worker
    container_name: celery_worker
    volumes:
      - .:/app/
    env_file:
      - ./.env

    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    image: celery_beat
    container_name: celery_beat
    volumes:
      - .:/app/
    env_file:
      - ./.env

    depends_on:
      - redis
      - db

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web


  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  db:
    image: postgres:16.0
    container_name: postgres

    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  redis_data: